name: mango_ripe
description: "Mobile-Based Mango Ripeness Detection Using Machine Learning"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Camera & Image Picker
  camera: ^0.11.1
  image_picker: ^1.1.2

  # Machine Learning
  tflite_flutter: ^0.12.1

  # Image Processing
  image: ^4.3.0

  # Local Storage (Hive)
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.4

  # UI Packages
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.4

  # Utilities
  intl: ^0.20.2
  share_plus: ^10.1.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/images/
